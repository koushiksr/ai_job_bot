<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Obsidian Briefcase Body Gradient -->
    <linearGradient id="jfCaseGrad" x1="6" y1="15" x2="42" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Supersonic Delta Jet Top Surface -->
    <linearGradient id="jfJetTop" x1="16" y1="6" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Delta Jet Bottom Shadow / Depth -->
    <linearGradient id="jfJetBtm" x1="25" y1="10" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Minimalist Handle -->
    <linearGradient id="jfHandle" x1="19" y1="8" x2="29" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Apex AI Beacon Glow Filter -->
    <filter id="jfSparkGlow" x="25" y="0" width="23" height="23" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Briefcase Handle -->
  <path d="M 18.5 15 C 18.5 10 29.5 10 29.5 15" stroke="url(#jfHandle)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Briefcase Body (Obsidian Finish) -->
  <rect x="5" y="16" width="38" height="26" rx="6" fill="url(#jfCaseGrad)" stroke="#27272a" stroke-width="1.6"/>

  <!-- Briefcase Horizontal Seam & Latch -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="#27272a" stroke-width="1.2" stroke-dasharray="2.5 2"/>
  <rect x="21.5" y="22" width="5" height="4" rx="1.2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>

  <!-- Velocity Propulsion Streaks from Jet -->
  <line x1="13" y1="32" x2="21" y2="27" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="37" x2="17" y2="32.5" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>

  <!-- Supersonic Delta Jet (Autonomous Job Application Rocket) -->
  <polygon points="42,5 17,21 28,24" fill="url(#jfJetTop)"/>
  <polygon points="42,5 28,24 31,34" fill="url(#jfJetBtm)"/>
  <line x1="42" y1="5" x2="28" y2="24" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

  <!-- AI Autonomous Beacon Spark at Apex -->
  <g filter="url(#jfSparkGlow)">
    <path d="M 42 1 Q 42 5 46 5 Q 42 5 42 9 Q 42 5 38 5 Q 42 5 42 1 Z" fill="#ffffff"/>
    <circle cx="42" cy="5" r="1.5" fill="#c084fc"/>
  </g>
</svg>