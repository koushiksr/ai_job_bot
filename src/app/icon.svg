<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jfCaseGrad" x1="6" y1="15" x2="42" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="jfJetTop" x1="16" y1="6" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="jfJetBtm" x1="25" y1="10" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="jfHandle" x1="19" y1="8" x2="29" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="jfSparkGlow" x="28" y="0" width="20" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Briefcase Handle -->
  <path d="M 18.5 15 C 18.5 10 29.5 10 29.5 15" stroke="url(#jfHandle)" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Briefcase Body (Transparent background around it) -->
  <rect x="5" y="16" width="38" height="26" rx="6" fill="url(#jfCaseGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Briefcase Horizontal Seam & Latch -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="#334155" stroke-width="1.5" stroke-dasharray="2.5 2"/>
  <rect x="21.5" y="22" width="5" height="4" rx="1.2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>

  <!-- Velocity Propulsion Streaks from Jet -->
  <line x1="13" y1="32" x2="21" y2="27" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="37" x2="17" y2="32.5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Supersonic Delta Jet (Autonomous Job Application Rocket) -->
  <polygon points="42,5 17,21 28,24" fill="url(#jfJetTop)"/>
  <polygon points="42,5 28,24 31,34" fill="url(#jfJetBtm)"/>
  <line x1="42" y1="5" x2="28" y2="24" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.95"/>

  <!-- AI Autonomous Beacon Spark at Apex -->
  <g filter="url(#jfSparkGlow)">
    <path d="M 43 1 Q 43 5 47 5 Q 43 5 43 9 Q 43 5 39 5 Q 43 5 43 1 Z" fill="#ffffff"/>
    <circle cx="43" cy="5" r="1.2" fill="#38bdf8"/>
  </g>
</svg>