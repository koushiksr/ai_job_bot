<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jfBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="jfRim" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Briefcase Body Gradient -->
    <linearGradient id="jfCase" x1="8" y1="17" x2="40" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131e33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a1120" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Supersonic Jet Top Wing -->
    <linearGradient id="jfJetTop" x1="15" y1="10" x2="37" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Supersonic Jet Bottom Wing -->
    <linearGradient id="jfJetBtm" x1="22" y1="14" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- AI Spark Filter -->
    <filter id="sparkGlow" x="28" y="2" width="20" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="url(#jfBg)" stroke="url(#jfRim)" stroke-width="1.5"/>

  <!-- Briefcase Handle -->
  <path d="M 19.5 15 C 19.5 12 28.5 12 28.5 15" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Briefcase Body (Career / Opportunities) -->
  <rect x="7" y="18" width="34" height="21" rx="4.5" fill="url(#jfCase)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.55"/>

  <!-- Briefcase Horizontal Seam & Metallic Latch -->
  <line x1="7" y1="24" x2="41" y2="24" stroke="#1e293b" stroke-width="1"/>
  <rect x="22" y="22.5" width="4" height="3" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>

  <!-- Velocity Propulsion Streaks from Jet (Flux) -->
  <line x1="14" y1="30" x2="20" y2="26" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="12" y1="34" x2="17" y2="30.5" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Supersonic Delta Jet (Autonomous Application Dispatch) -->
  <!-- Top/Left Wing -->
  <polygon points="37,10 18,22 26,24" fill="url(#jfJetTop)"/>
  <!-- Bottom/Right Wing -->
  <polygon points="37,10 26,24 28,31" fill="url(#jfJetBtm)"/>
  <!-- Crisp Center Trajectory Spine -->
  <line x1="37" y1="10" x2="26" y2="24" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.95"/>

  <!-- AI Autonomous Beacon Spark -->
  <g filter="url(#sparkGlow)">
    <path d="M 38 5 Q 38 8.5 41.5 8.5 Q 38 8.5 38 12 Q 38 8.5 34.5 8.5 Q 38 8.5 38 5 Z" fill="#ffffff"/>
    <circle cx="38" cy="8.5" r="1" fill="#38bdf8"/>
  </g>
</svg>