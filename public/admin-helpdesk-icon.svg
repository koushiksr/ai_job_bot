<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metallic Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Green Glow -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M60 8 L104 26 C104 68 84 98 60 112 C36 98 16 68 16 26 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Subtle Inset Shield -->
  <path d="M60 16 L96 32 C96 66 79 92 60 103 C41 92 24 66 24 32 Z" 
        fill="#09090b" 
        fill-opacity="0.85" 
        stroke="#27272a" 
        stroke-width="1.2" />

  <!-- Cyan AI Orbital Ring (JobFlux AI) -->
  <ellipse cx="60" cy="58" rx="28" ry="15" 
           transform="rotate(-25 60 58)" 
           fill="none" 
           stroke="#00e5ff" 
           stroke-width="2.2" 
           opacity="0.9" 
           filter="url(#cyanGlow)" />

  <!-- Emerald Pulse Wave (FitMetrix) -->
  <path d="M22 62 H38 L44 48 L50 74 L56 54 L62 68 L68 58 L74 62 H98" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.9" 
        filter="url(#greenGlow)" />

  <!-- Center Helpdesk Core (Headset + Spark) -->
  <circle cx="60" cy="58" r="14" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Headset -->
  <path d="M52 58 A8 8 0 0 1 68 58 V62 A2 2 0 0 1 66 64 H65 A2 2 0 0 1 63 62 V58 A2 2 0 0 1 65 56" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" />
  <path d="M55 58 V62 A2 2 0 0 0 57 64 H58" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" />
  <path d="M66 63 C66 67 63 68 60 68 H58" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="1.5" 
        stroke-linecap="round" />

  <!-- Central Star Spark -->
  <circle cx="60" cy="56" r="2" fill="#fbbf24" />
</svg>
